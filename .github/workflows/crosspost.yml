name: TikTok Crossposter Workflow

on:
  schedule:
    - cron: '*/30 * * * *'  # Se ejecuta automáticamente cada 30 minutos
  workflow_dispatch:        # Permite botón de activación manual en GitHub

permissions:
  contents: write

# Una sola corrida a la vez: dos corridas en paralelo se pisan los JSON de estado.
concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Sin esto, la corrida hace checkout del commit que la disparo. Una
          # corrida que espero en la cola arrancaria con el estado congelado de
          # cuando se creo y republicaria lo que la anterior acaba de publicar.
          ref: main
          fetch-depth: 0

      - name: Refrescar estado publicado
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Estado en: $(git rev-parse --short HEAD)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TikTok Crossposter
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_SEC_UID: ${{ secrets.TIKTOK_SEC_UID }}
          MAX_VIDEO_AGE_DAYS: ${{ vars.MAX_VIDEO_AGE_DAYS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_SUBREDDIT: ${{ secrets.REDDIT_SUBREDDIT }}
          REDDIT_FLAIR_ID: ${{ secrets.REDDIT_FLAIR_ID }}
          REDDIT_FLAIR_TEXT: ${{ secrets.REDDIT_FLAIR_TEXT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tiktok_crossposter.py

      - name: Commit and Push Updated Processed Videos and Queue JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add processed_videos.json pending_queue.json platform_status.json 2>/dev/null || git add processed_videos.json
          git status
          git diff-index --quiet HEAD && echo "Sin cambios que guardar." && exit 0
          git commit -m "update: processed_videos and pending_queue [skip ci]"
          # Si alguien mas empujo mientras publicabamos, rebasar y reintentar:
          # perder este commit significaria republicar el video en la siguiente corrida.
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Estado guardado (intento $intento)."
              exit 0
            fi
            echo "Push rechazado, rebasando sobre origin/main (intento $intento)..."
            git pull --rebase --autostash origin main || exit 1
            sleep $((intento * 3))
          done
          echo "::error::No se pudo guardar el estado tras 5 intentos."
          exit 1
